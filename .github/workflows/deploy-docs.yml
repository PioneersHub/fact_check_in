name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # zizmor: ignore[artipacked] mkdocs gh-deploy pushes to the gh-pages branch, so the
        # checkout credentials have to stay in .git/config for the deploy step to work.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Cairo dependencies (for social cards)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev

      - name: Sync README to docs
        run: uv run python scripts/sync_readme_to_docs.py

      - name: Build and deploy docs
        run: uv run mkdocs gh-deploy --force --clean --verbose
